<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartCampus - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .login-container {
            width: 90%;
            max-width: 450px;
            margin: 60px auto;
        }

        .login-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .login-card h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .login-card .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .login-card button {
            width: 100%;
            margin-top: 5px;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<nav>
    <a href="/">Home</a>
    <a href="/login">Login</a>
    <a href="/register">Register</a>
</nav>

<div class="login-container">

    <div class="login-card">

        <h1>🔐 Student Login</h1>

        <p class="subtitle">
            Login to access your SmartCampus dashboard
        </p>

        <form method="POST">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div class="register-link">
            Don't have an account?
            <a href="/register">Create Account</a>
        </div>

    </div>

</div>

<footer>
    <p>SmartCampus © 2026</p>
</footer>

</body>
</html>
